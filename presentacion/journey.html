<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cómo lo resolvemos — Osler Hub</title>
<script>document.documentElement.setAttribute("data-theme","light");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../taller.css">
<link rel="stylesheet" href="lamina.css">
<script src="../enlace.js"></script>
<script src="../gestos.js"></script>
<script>try{if(window.parent!==window&&!/[?&]previa=1/.test(location.search))document.documentElement.className+=" con-telon";}catch(e){}</script>

<style>
  /* ═══════════════════════════════════════════════════════════
     El journey de Camilo.

     Un disco enorme anclado al borde izquierdo, cortado por la
     pantalla, y una rueda de seis palabras montada sobre su mismo
     centro. La palabra que manda siempre está en el medio, a la
     derecha del disco. Al pasar de etapa la rueda entera gira 60°:
     la que estaba se va bajando por el borde del círculo hasta
     salirse por abajo, y la siguiente entra desde arriba y se planta
     en el medio. Las otras cuatro están al otro lado del disco, fuera
     de cuadro.

     Nada de tarjetas: lo que se cuenta lo pone quien habla.
     ═══════════════════════════════════════════════════════════ */

  .lamina.entera{
    position:relative;
    display:block;
    padding:0;
    overflow:hidden;      /* el disco se sale por la izquierda a propósito */
  }

  /* ── el eje ────────────────────────────────────────────────
     Un punto sin tamaño pegado al borde izquierdo. Todo —el disco y
     la rueda— cuelga de aquí, así que los dos comparten centro por
     construcción y no por cuadrar números a mano. */
  .ruedo{
    --R:  min(58vh, 30vw);                        /* radio del disco */
    --Rw: calc(var(--R) + clamp(48px, 9vw, 150px));  /* radio de la rueda */
    position:absolute;
    left:4%; top:50%;
    width:0; height:0;
  }

  /* ── el disco ─────────────────────────────────────────────
     Cinco de las seis fotos son recortes sin fondo, así que el color
     lo pone el disco. Las seis viven apiladas y solo cambia cuál se
     ve: pasar de etapa es un fundido, no una carga. */
  .disco{
    position:absolute; left:0; top:0;
    width:calc(var(--R) * 2); height:calc(var(--R) * 2);
    margin:calc(var(--R) * -1) 0 0 calc(var(--R) * -1);
    border-radius:50%;
    overflow:hidden;
    background:linear-gradient(158deg,
      hsl(216,96%,94%) 0%,
      var(--cielo) 46%,
      hsl(180,40%,80%) 100%);
  }

  /* El encuadre va foto a foto y no con una regla común, porque las seis
     están tomadas a distancias distintas: en una Camilo sale de cuerpo
     entero y en otra es un primer plano. Medí en cada archivo el ancho de
     la cabeza y dónde empieza, y de ahí salen `--h` (altura a la que se
     dibuja) y `--x` / `--y` (dónde cae). Con esos números las seis cabezas
     miden lo mismo en pantalla y todas arrancan a la misma altura: la
     figura no da saltos de tamaño al pasar de etapa.
     Todo en % del disco, así aguanta cualquier tamaño de ventana. */
  .foto{position:absolute; inset:0}
  .capa{
    position:absolute;
    left:var(--x); top:var(--y); height:var(--h);
    overflow:hidden;
    opacity:0;
    transform:translateY(14px);
    transition:opacity .6s ease, transform .9s cubic-bezier(.16,1,.3,1);
  }
  .capa.activa{opacity:1;transform:none}
  .capa img{display:block; height:100%; width:auto}

  /* Los recortes están cortados por el lienzo allí donde el brazo, la mesa o
     el portátil se salían de la foto, y ese canto recto sobre el disco se lee
     como una losa flotando. Dos máscaras cruzadas —una horizontal y otra
     vertical— disuelven cada borde en el color; solo sobrevive lo que las dos
     dejan pasar. Los lados van a cero por defecto: la mayoría solo necesita
     el de abajo, y a los que además tocan un costado se les da `--lx`/`--rx`. */
  .capa img{
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 var(--lx,0%),
                                #000 calc(100% - var(--rx,0%)), transparent 100%),
      linear-gradient(to bottom, #000 var(--m0,82%), transparent var(--m1,100%));
    mask-image:
      linear-gradient(to right, transparent 0, #000 var(--lx,0%),
                                #000 calc(100% - var(--rx,0%)), transparent 100%),
      linear-gradient(to bottom, #000 var(--m0,82%), transparent var(--m1,100%));
    -webkit-mask-composite:source-in;
            mask-composite:intersect;
  }

  /* La primera es la única con fondo de verdad —un jardín— y de cuerpo
     entero. Se recorta a busto para que su cabeza mida lo que las otras, y
     en vez de enmarcarla se le pasa un velo elíptico: el jardín se disuelve
     en el color del disco y deja de leerse como una foto pegada encima.

     El velo solo, sin embargo, no cerraba por arriba: la elipse desborda el
     lienzo por la coronilla, así que el canto superior de la foto llegaba
     al disco con un tercio de tinta todavía puesta y se leía como una raya
     recta sobre el jardín. Va cruzado con un desvanecido de arriba que sí
     toca cero justo donde acaba el lienzo, y la elipse sube un poco para
     devolverle a la cabeza la opacidad que el cruce le quita.

     Ese desvanecido no es una rampa recta. Una recta sale de cero con
     pendiente entera, y ese quiebre se ve: no como un canto, pero sí como
     el renglón donde empieza a aparecer el jardín. Los tramos de abajo
     dibujan una ese —arranca plana, gana en el medio y se asienta— para que
     no haya ningún punto en el que la foto «empiece». */
  .capa.busto{
    width:var(--w); overflow:visible;
    --velo-arriba:
      transparent 0,
      rgba(0,0,0,.03)  1.2%, rgba(0,0,0,.11)  2.4%, rgba(0,0,0,.26) 3.6%,
      rgba(0,0,0,.45)  4.8%, rgba(0,0,0,.64)  6.0%, rgba(0,0,0,.80) 7.2%,
      rgba(0,0,0,.91)  8.4%, rgba(0,0,0,.97)  9.6%, #000 11%;
  }
  .capa.busto img{
    position:absolute;
    height:var(--zoom); left:var(--ix); top:var(--iy);
    -webkit-mask-image:
      radial-gradient(ellipse 50% 50% at 50% 36%, #000 46%, transparent 100%),
      linear-gradient(to bottom, var(--velo-arriba));
    mask-image:
      radial-gradient(ellipse 50% 50% at 50% 36%, #000 46%, transparent 100%),
      linear-gradient(to bottom, var(--velo-arriba));
    -webkit-mask-composite:source-in;
            mask-composite:intersect;
  }

  /* ── la rueda de palabras ─────────────────────────────────
     `--rho` es cuánto ha girado la rueda; `--a` es el sitio fijo de
     cada palabra en ella. La punta deshace las dos —gira
     `-(rho + a)`— para que el texto viaje por el arco sin ladearse.
     Las dos transiciones comparten curva y duración o se desfasan. */
  .rueda{
    position:absolute; left:0; top:0; width:0; height:0;
    transform:rotate(var(--rho, 0deg));
    transition:transform .9s cubic-bezier(.16,1,.3,1);
  }
  .radio{
    position:absolute; left:0; top:0; width:0; height:0;
    transform:rotate(var(--a));
    visibility:hidden;
  }
  /* Solo la que manda y sus dos vecinas: son las únicas que se cruzan por
     el cuadro durante el giro. Las otras cuatro caen al otro lado del disco
     y, como la palabra cuelga por su borde izquierdo, a las largas les
     asomaba la cola por el margen. */
  .radio.cerca{visibility:visible}
  .punta{
    position:absolute; left:var(--Rw); top:0; width:0; height:0;
    transform:rotate(calc(-1 * (var(--rho, 0deg) + var(--a))));
    transition:transform .9s cubic-bezier(.16,1,.3,1);
  }
  .palabra{
    position:absolute; left:0; top:0;
    transform:translateY(-50%);
    white-space:nowrap;
    font-family:var(--titulo);
    font-weight:700;
    font-style:italic;
    font-size:clamp(28px,4.7vw,72px);
    line-height:1;
    letter-spacing:-.016em;
    color:var(--tinta);
  }

  /* ── lo poco que queda de interfaz ────────────────────────── */
  .rotulo-flotante{
    position:absolute; top:26px; left:50%;
    transform:translateX(-50%);
    margin:0;
    font-size:10px; letter-spacing:.34em; text-transform:uppercase;
    color:var(--apagado);
  }
  .cuenta{
    position:absolute; bottom:30px; right:clamp(28px,4vw,64px);
    margin:0;
    font-size:11px; letter-spacing:.22em;
    color:var(--apagado);
    font-variant-numeric:tabular-nums;
  }
  .cuenta b{color:var(--tinta);font-weight:600}

  /* ── llegada y salida ─────────────────────────────────────── */
  html.entrando .ruedo{animation:asomarRuedo 1.05s cubic-bezier(.16,1,.3,1) .04s both}
  html.entrando .rotulo-flotante,
  html.entrando .cuenta{animation:asomarTexto .8s cubic-bezier(.16,1,.3,1) .26s both}
  @keyframes asomarRuedo{from{opacity:0;transform:translateX(-42px)}to{opacity:1;transform:none}}

  html.saliendo .ruedo{
    opacity:0;transform:translateX(-32px);
    transition:opacity .4s ease,transform .5s cubic-bezier(.6,0,.9,.4);
  }
  html.saliendo .rotulo-flotante,
  html.saliendo .cuenta{opacity:0;transition:opacity .34s ease}

  @media (prefers-reduced-motion:reduce){
    html.entrando .ruedo,
    html.entrando .rotulo-flotante,
    html.entrando .cuenta{animation:none}
    .rueda,.punta,.capa{transition:none}
  }

  /* En ventana estrecha —las miniaturas del índice— el disco encoge
     para que a la palabra le quede sitio. */
  @media (max-width:900px){
    .ruedo{--R:min(46vh,34vw)}
    .palabra{font-size:clamp(18px,4.6vw,30px)}
  }
</style>
</head>
<body data-seccion="journey">

<div id="telon" aria-hidden="true"></div>

<a class="volver" href="../slides 2/page3.html" data-seccion="indice" aria-label="Volver al índice">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</a>

<main class="lamina entera">
  <p class="rotulo-flotante">Cómo lo resolvemos</p>

  <div class="ruedo" id="ruedo">
    <div class="disco">
      <div class="foto" id="foto"></div>
    </div>
    <div class="rueda" id="rueda"></div>
  </div>

  <p class="cuenta"><b id="cN">01</b> / 06</p>
</main>

<script src="costura.js"></script>
<script>
(function(){
  "use strict";

  /* Cada etapa: el archivo tal cual está en la carpeta, la palabra tal cual
     se lee, y su encuadre dentro del disco —todo en % del disco—.

     `h` es la altura a la que se dibuja; sale de igualar el ancho de la
     cabeza. `x` e `y` colocan la cara sobre el mismo eje y la coronilla a la
     misma altura. `m0`/`m1` mueven el fundido de abajo cuando el recorte no
     llega al borde del lienzo, y `lx`/`rx` lo añaden a los costados cuando el
     brazo o la mesa se salían de la foto.

     No todas van a la misma cabeza, y es a propósito. La 03 y la 04 son
     planos cerrados —cabeza, brazos y poco más— y a igual cabeza se
     quedaban pequeñas dentro del disco, así que van a 140 px. La 05 y la 06
     enseñan cuerpo y con 117 ya lo llenan. Y la 01 se queda en 96: es el
     plano de presentación, Camilo de cuerpo entero y más lejos, con su
     propio recorte a busto. Todas ellas comparten la línea de la coronilla,
     que es lo que impide que la figura salte al pasar de etapa.

     La 02 es la excepción, y va aparte: es un plano tumbado —Camilo apoyado
     sobre el portátil— que no tiene vertical de la que colgar, así que
     alinearlo por la coronilla lo dejaba arrinconado arriba a la izquierda
     con medio disco vacío debajo. Ese se centra en el trozo de disco que se
     ve, no en el disco entero, y crece hasta donde el arco lo deja. */
  var ETAPAS = [
    { archivo:"El es camilo",      palabra:"“Él es Camilo”",
      x:"44.1%", y:"28.0%", h:"42.3%",
      busto:true, w:"44%", zoom:"172.9%", ix:"-12.3%", iy:"-7.8%" },
    { archivo:"Entrevista",        palabra:"Entrevista",
      x:"48.3%", y:"17.0%", h:"61.3%", lx:"13%", rx:"8%" },
    { archivo:"Procedimientos",    palabra:"Procedimientos",
      x:"46.0%", y:"26.5%", h:"52.5%", lx:"8%", rx:"8%" },
    { archivo:"Diagnóstico",       palabra:"Diagnóstico",
      x:"39.4%", y:"24.9%", h:"61.7%", m0:"70%", m1:"80.5%" },
    { archivo:"Plan de manejo",    palabra:"Plan de manejo",
      x:"45.0%", y:"29.9%", h:"50.0%", lx:"12%", rx:"11%" },
    { archivo:"Retroalimentación", palabra:"Retroalimentación",
      x:"42.2%", y:"29.4%", h:"61.8%" }
  ];

  var N = ETAPAS.length;
  /* Seis palabras repartidas por la rueda entera. A 60° la vecina de arriba
     y la de abajo quedan justo fuera de cuadro cuando la rueda está quieta,
     y solo se las ve cruzar mientras gira. Las otras cuatro caen al otro
     lado del disco, fuera de la pantalla por la izquierda. */
  var PASO = 360 / N;

  var foto  = document.getElementById("foto");
  var rueda = document.getElementById("rueda");
  var cN    = document.getElementById("cN");

  /* Las seis fotos, apiladas y precargadas: cambiar de etapa es cambiar cuál
     lleva la clase, y el navegador funde una con otra sin esperas. */
  var fotos = ETAPAS.map(function(e){
    var capa = document.createElement("span");
    capa.className = "capa" + (e.busto ? " busto" : "");
    var est = "--x:" + e.x + ";--y:" + e.y + ";--h:" + e.h;
    if (e.w)  est += ";--w:" + e.w + ";--zoom:" + e.zoom + ";--ix:" + e.ix + ";--iy:" + e.iy;
    if (e.m0) est += ";--m0:" + e.m0 + ";--m1:" + e.m1;
    if (e.lx) est += ";--lx:" + e.lx + ";--rx:" + e.rx;
    capa.setAttribute("style", est);

    var img = document.createElement("img");
    img.src = "../ImagenesJourney/" + encodeURIComponent(e.archivo) + ".png";
    img.alt = e.palabra.replace(/[“”]/g, "");
    img.decoding = "async";
    capa.appendChild(img);
    foto.appendChild(capa);
    return capa;
  });

  /* La palabra i vive en la rueda a -i·60°. Con la rueda girada +i·60°, la i
     cae en las tres en punto —el medio de la pantalla— y las demás quedan
     donde les toca sin que haya que moverlas nunca. */
  var radios = ETAPAS.map(function(e, i){
    var radio = document.createElement("span");
    radio.className = "radio";
    radio.style.setProperty("--a", (-i * PASO).toFixed(2) + "deg");
    radio.innerHTML = '<span class="punta"><span class="palabra"></span></span>';
    radio.querySelector(".palabra").textContent = e.palabra;
    rueda.appendChild(radio);
    return radio;
  });

  var actual = -1;

  function ir(i, deGolpe){
    if (i < 0 || i >= N || i === actual) return;
    actual = i;

    /* Girar en positivo baja la que estaba y trae la siguiente desde arriba.
       Al revés subiría, que es justo lo contrario de lo que se cuenta. */
    var giro = (i * PASO).toFixed(2) + "deg";
    if (deGolpe){
      rueda.style.transition = "none";
      rueda.style.setProperty("--rho", giro);
      rueda.getBoundingClientRect();          // fuerza el reflow antes de devolverle la transición
      rueda.style.transition = "";
    } else {
      rueda.style.setProperty("--rho", giro);
    }

    fotos.forEach(function(f, j){ f.classList.toggle("activa", j === i); });
    radios.forEach(function(rd, j){ rd.classList.toggle("cerca", Math.abs(j - i) <= 1); });
    cN.textContent = ("0" + (i + 1)).slice(-2);
  }

  function avanzar(){
    if (actual < N - 1){ ir(actual + 1); return; }
    if (window.Taller) Taller.terminar();
    else location.href = "../slides 2/page3.html";
  }
  function retroceder(){ ir(actual - 1); }

  addEventListener("keydown", function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === "ArrowRight" || k === "ArrowDown" || k === " " || k === "PageDown"){
      avanzar(); e.preventDefault();
    } else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp"){
      retroceder(); e.preventDefault();
    }
  });

  /* Dentro del deck el teclado escribe donde está el foco: si la lámina no
     se lo lleva al llegar, las flechas no llegan hasta aquí. */
  window.alLlegarLamina = function(){
    try { window.focus(); } catch (err) {}
    actual = -1;
    ir(0, true);
  };

  ir(0, true);
})();
</script>
</body>
</html>
