<style>
  /* ── el ciclo, en tres dimensiones ────────────────────────
     Tres cúmulos de esferas girando sobre un anillo tumbado. No es un grafo
     dibujado: es el mismo motor de la portada —cada esfera trazada con su
     luz y su sombra— con perspectiva de verdad, así que el que está detrás
     se ve detrás y el de delante lo tapa. */
  .grafo{position:relative;width:100%;height:100%;max-height:520px}
  .grafo canvas{
    position:absolute;inset:0;width:100%;height:100%;
    cursor:pointer;touch-action:none;
  }

  /* Los rótulos van en HTML y no en el lienzo: la letra se mantiene nítida.
     El guion los coloca cada cuadro proyectando el centro de cada cúmulo. */
  .rotulos{position:absolute;inset:0;pointer-events:none}
  .rotulo-nodo{
    position:absolute;left:0;top:0;
    text-align:center;white-space:nowrap;
    transition:color .35s ease;
  }
  .rotulo-nodo b{
    display:block;
    font-family:var(--titulo);font-weight:400;
    font-size:19px;line-height:1;color:var(--tinta);
  }
  .rotulo-nodo span{
    display:block;margin-top:5px;
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--apagado);
  }
  .rotulo-nodo.mando b{color:var(--indigo)}
  .rotulo-nodo.mando span{color:var(--tinta);font-weight:600}

  /* ── la ficha de la izquierda ──────────────────────────── */
  .tarjeta{
    border:1px solid var(--linea);
    border-left:2px solid var(--azul);
    background:var(--papel);
    border-radius:3px;
    padding:22px 24px;
    display:flex;flex-direction:column;gap:14px;
    min-height:140px;
    transition:opacity .32s ease,transform .32s cubic-bezier(.16,1,.3,1);
  }
  .cita{white-space:pre-line}
  .tarjeta.cambiando{opacity:0;transform:translateY(10px)}

  /* ── el cierre ────────────────────────────────────────────
     Vistos los tres, el texto de la izquierda se va y las esferas se
     reparten alrededor de la conclusión, que es de los tres a la vez. */
  .lamina{transition:grid-template-columns .95s cubic-bezier(.16,1,.3,1)}
  .columna{transition:opacity .5s ease,transform .75s cubic-bezier(.5,0,.8,.4)}
  html.cierre .lamina{grid-template-columns:0 minmax(0,1fr)}
  html.cierre .columna{opacity:0;transform:translateX(-52px);pointer-events:none;overflow:hidden}
  .nota-escena{transition:opacity .4s ease}
  html.cierre .nota-escena{opacity:0}

  /* La frase del momento, debajo de la esfera que manda. La coloca el guion:
     va donde acaba esa esfera, y esa esfera siempre cae en el mismo sitio. */
  .frase{
    position:absolute;left:50%;top:50%;z-index:3;
    transform:translateX(-50%);
    width:min(430px,54%);
    margin:0;text-align:center;
    font-family:var(--titulo);font-weight:400;
    font-variation-settings:'opsz' 120,'SOFT' 0,'WONK' 0;
    font-size:clamp(16px,1.42vw,22px);
    line-height:1.3;letter-spacing:-.008em;
    color:var(--tinta);
    opacity:0;pointer-events:none;
    transition:opacity .45s ease .2s;
  }
  html.cierre .frase{opacity:1}
  .frase.cambiando{opacity:0;transition:opacity .22s ease}

  .selector{display:flex;gap:6px;flex-wrap:wrap}
  .selector button{
    appearance:none;cursor:pointer;font:inherit;
    border:1px solid var(--linea);background:transparent;
    color:var(--apagado);
    border-radius:999px;padding:7px 13px;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    transition:all .24s ease;
  }
  .selector button:hover{color:var(--tinta);border-color:var(--azul)}
  .selector button[aria-pressed="true"]{
    background:var(--tinta);border-color:var(--tinta);color:var(--papel);
  }

</style>

<script src="costura.js"></script>
<script>
(function(){
  "use strict";

  var NODOS = [
    {
      n:"01", corto:"Ansiedad",
      cita:"“Me da nervio que me estén viendo”",
      pie:"Estudiante de medicina UPB",
      detalle:""
    },
    {
      n:"02", corto:"Método",
      cita:"“El razonamiento diagnóstico no se hace paso por paso, se hace de manera integral.”",
      pie:"Estudiante de medicina UPB",
      detalle:""
    },
    {
      n:"03", corto:"Feedback",
      cita:"\"No hay oportunidad de que repitan la explicación, el tiempo es demasiado corto.\" — Vanessa\n\n\"Te dicen en qué podrías mejorar. Y ya. No te entregan nada más.\" — Mariana",
      pie:"Estudiantes de medicina UPB",
      detalle:""
    }
  ];

  /* ═══════════════ el motor ═══════════════
     Cada esfera es una tarjeta orientada a la cámara y el fragmento resuelve
     la normal de la esfera exacta: geometría real, no un degradado. Es la
     técnica del órgano de la portada, aquí en su versión corta. */

  var lienzo = document.getElementById("lienzo");
  var gl = lienzo.getContext("webgl2", {
    alpha:true, antialias:true, premultipliedAlpha:true
  });

  var VS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 aQuad; in vec3 aCentro; in float aRadio; in vec3 aColor; in float aLuce;',
    'uniform mat4 uProy;',
    'out vec2 vUV; out vec3 vColor; out vec3 vCentro; out float vRadio; out float vLuce;',
    'void main(){',
    '  vec2 q = aQuad * (1.0 + abs(aLuce)*0.62);',
    '  gl_Position = uProy * vec4(aCentro + vec3(q*aRadio, 0.0), 1.0);',
    '  vUV=q; vColor=aColor; vCentro=aCentro; vRadio=aRadio; vLuce=aLuce;',
    '}'
  ].join('\n');

  var FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUV; in vec3 vColor; in vec3 vCentro; in float vRadio; in float vLuce;',
    'uniform vec3 uLuz; uniform vec3 uHondo; uniform vec3 uFondo; uniform float uDist;',
    'out vec4 fragColor;',
    'void main(){',
    '  float d = length(vUV);',
    '  float aa = fwidth(d);',
    '  float borde = 1.0 - smoothstep(1.0-aa, 1.0+aa*0.4, d);',
    // aLuce negativo = solo aura, sin encender el cuerpo: es el elegido
    '  float aura = abs(vLuce);',
    '  float brillo = max(0.0, vLuce);',
    // El aura tiene que morir ANTES del borde de la tarjeta. Con una caída
    // exponencial quedaba viva en las esquinas y se veía el cuadrado.
    '  float halo = aura*aura*pow(1.0 - smoothstep(0.86, 1.34, d), 1.5);',
    '  if (borde <= 0.0){',
    '    if (halo <= 0.004) discard;',
    '    float a = halo*0.34;',
    '    fragColor = vec4(mix(vColor, vec3(1.0), 0.6)*a*1.3, a);',
    '    return;',
    '  }',
    '  float z = sqrt(max(0.0, 1.0 - min(d*d, 1.0)));',
    '  vec3 N = vec3(vUV, z);',
    '  vec3 pos = vCentro + N*vRadio;',
    '  vec3 V = normalize(-pos);',
    '  vec3 L = normalize(uLuz - pos);',
    '  float w = pow(clamp(dot(N,L)*0.5+0.5, 0.0, 1.0), 1.30);',
    '  vec3 hondo = mix(vColor*vColor*1.12, uHondo, 0.26);',
    '  vec3 col = mix(mix(vColor, hondo, 0.88), mix(vColor, vec3(1.0), 0.52), w);',
    '  float fres = pow(1.0 - max(dot(N,V), 0.0), 2.2);',
    '  col = mix(col, hondo, fres*0.34*(1.0-w));',
    '  col = mix(col, vec3(1.0), fres*0.20*w);',
    '  col = mix(col, mix(vColor, vec3(1.0), 0.9), brillo*0.9);',
    '  col += brillo*brillo*0.4;',
    '  float t = vCentro.z + uDist;',
    '  col = mix(col, uFondo, clamp((0.9-t)*0.15, 0.0, 0.34));',
    '  fragColor = vec4(col*borde, borde);',
    '}'
  ].join('\n');

  function compilar(tipo, src){
    var s = gl.createShader(tipo);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compilar(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compilar(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var uProy  = gl.getUniformLocation(prog, "uProy");
  var uLuz   = gl.getUniformLocation(prog, "uLuz");
  var uHondo = gl.getUniformLocation(prog, "uHondo");
  var uFondo = gl.getUniformLocation(prog, "uFondo");
  var uDist  = gl.getUniformLocation(prog, "uDist");

  gl.bindVertexArray(gl.createVertexArray());

  var quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  var MAX = 120;                    // ocho flotantes por esfera
  var datos = new Float32Array(MAX*8);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, datos.byteLength, gl.DYNAMIC_DRAW);
  [[1,3,0],[2,1,3],[3,3,4],[4,1,7]].forEach(function(a){
    gl.enableVertexAttribArray(a[0]);
    gl.vertexAttribPointer(a[0], a[1], gl.FLOAT, false, 32, a[2]*4);
    gl.vertexAttribDivisor(a[0], 1);
  });

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

  /* ═══════════════ la escena ═══════════════ */

  var PAPEL  = [0.976, 0.980, 0.988];
  var AQUA   = [0.510, 0.790, 0.790];
  var AZUL   = [0.260, 0.430, 0.760];
  var INDIGO = [0.147, 0.116, 0.305];
  var GRIS   = [0.888, 0.897, 0.918];
  var GRIS2  = [0.792, 0.803, 0.845];

  var DIST = 12.4, FOV = 0.58, RADIO = 3.05, TUMBA = 0.33;
  /* Una vuelta lenta. Que sea tan larga es a propósito: el anillo sigue
     girando después de elegir, así que si corriera se llevaría al elegido al
     fondo en cuestión de segundos. */
  var VUELTA = 92000;
  var ESLABON = 20;                 // cuentas por hilo
  var CUERPO = 0.94;                // radio del cuerpo de cada problema

  var W = 1, H = 1, DPR = 1, proy = new Float32Array(16), FOCO = 1;

  function medir(){
    var r = lienzo.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    DPR = Math.min(2, window.devicePixelRatio || 1);
    lienzo.width  = Math.round(W*DPR);
    lienzo.height = Math.round(H*DPR);
    gl.viewport(0, 0, lienzo.width, lienzo.height);

    FOCO = 1/Math.tan(FOV/2);
    var near = 0.1, far = 60;
    proy.fill(0);
    proy[0] = FOCO/(W/H); proy[5] = FOCO;
    proy[10] = (far+near)/(near-far); proy[11] = -1;
    proy[14] = 2*far*near/(near-far);
    gl.uniformMatrix4fv(uProy, false, proy);
  }

  /* Del mundo a la vista: se tumba el anillo y se aleja la cámara. Se hace
     aquí y no en el shader porque el orden de pintado necesita esa z. */
  var ct = Math.cos(TUMBA), st = Math.sin(TUMBA), tmp = [0,0,0];
  function aVista(x, y, z, out){
    out[0] = x;
    out[1] = y*ct - z*st;
    out[2] = y*st + z*ct - DIST;
  }

  var elegido = 0, giro = 0, ultimo = 0, quieto = false, destino = null;
  /* El recorrido de la sección: los tres problemas y, al final, el cierre.
     `cierreT` es lo avanzada que está esa mudanza, de 0 a 1. */
  var raiz = document.documentElement;
  var enCierre = false, cierreT = 0, pasoCierre = 0;
  /* En el cierre los tres se reparten sobre una elipse: dos arriba en las
     esquinas y el que manda abajo en medio, un poco por encima del suelo para
     dejarle sitio a su frase. Cada paso adelante gira la elipse un tercio, así
     que el de arriba a la izquierda baja a mandar y el que mandaba se va a la
     derecha. */
  var ELIPSE_A = 5.66, ELIPSE_B = 1.967, ELIPSE_C = 1.417;
  var PRINCIPAL = -Math.PI/2;                  // el sitio de la que manda
  var TERCIO = Math.PI*2/3;
  /* Dónde arranca cada uno. El orden lo dictan las frases: la primera habla del
     método, la segunda de la ansiedad y la tercera del feedback. */
  var TH0 = [PRINCIPAL - TERCIO, PRINCIPAL, PRINCIPAL + TERCIO];
  var giroCierre = 0, metaCierre = 0;

  var FRASES = [
    "El estudiante practica poco, entonces no internaliza el método.",
    "No internaliza el método, entonces cada simulación le da más ansiedad.",
    "Y el feedback que recibe no se registra para mejorar antes de la siguiente."
  ];
  var centros = [[0,0,0],[0,0,0],[0,0,0]];
  var escalas = [1, 1, 1];
  var manda   = [0, 0, 0];   // cuánto manda cada uno en el cierre
  var radios  = [1, 1, 1];
  var VAIVEN = [2400, 3150, 2780];   // ms de cada respiración
  var FASE   = [0, 2.1, 4.0];
  var ALTURA = [0.15, 0.11, 0.18];
  var lista = [];

  function poner(x, y, z, r, c, l){ lista.push({ x:x, y:y, z:z, r:r, c:c, l:l }); }
  function mezclar(a, b, t){
    return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
  }

  function armar(ahora){
    lista.length = 0;

    for (var i = 0; i < 3; i++){
      var a = giro + (i/3)*Math.PI*2 - Math.PI/2;
      // en el cierre no manda ninguno: los tres son la misma frase
      var mando = enCierre || (i === elegido);
      /* Cuánto le toca mandar a este: 1 cuando está en el sitio principal y 0
         cuando está en cualquiera de los dos de arriba. */
      var th = TH0[i] + giroCierre;
      var prox = Math.max(0, (0.5 + 0.5*Math.cos(th - PRINCIPAL) - 0.25)/0.75);
      manda[i] = prox;

      var meta = enCierre ? (0.68 + 0.62*prox) : (mando ? 1.32 : 0.84);
      escalas[i] += (meta - escalas[i])*0.07;
      var e = escalas[i];
      /* Cada cuerpo respira a su aire: distinto periodo, distinta amplitud y
         distinta fase, para que nunca se lea como un movimiento de conjunto. */
      var flota = Math.sin(ahora/VAIVEN[i] + FASE[i])*ALTURA[i];

      aVista(Math.cos(a)*RADIO, flota, Math.sin(a)*RADIO, tmp);
      if (cierreT > 0){
        // del anillo a su sitio en la elipse, con la respiración intacta
        var e2 = cierreT*cierreT*(3 - 2*cierreT);
        var cx = ELIPSE_A*Math.cos(th);
        var cy = ELIPSE_C + ELIPSE_B*Math.sin(th) + flota;
        tmp[0] += (cx - tmp[0])*e2;
        tmp[1] += (cy - tmp[1])*e2;
        tmp[2] += (-DIST - tmp[2])*e2;
      }
      centros[i][0] = tmp[0]; centros[i][1] = tmp[1]; centros[i][2] = tmp[2];

      radios[i] = CUERPO*e;
      poner(tmp[0], tmp[1], tmp[2], radios[i],
            mando ? mezclar(AQUA, AZUL, 0.52) : mezclar(GRIS, GRIS2, 0.35),
            enCierre ? -(0.24 + 0.42*prox) : (mando ? -0.62 : 0));  // negativo: aura sí, lavado no
    }

    // los hilos, en el sentido del ciclo: 01 empuja a 02, 02 a 03, 03 a 01
    for (var j = 0; j < 3; j++){
      var de = centros[j], al = centros[(j+1)%3];
      var vivo = enCierre || (j === elegido) || ((j+1)%3 === elegido);
      /* El hilo empieza donde acaba la esfera: si arrancara en el centro, las
         primeras cuentas quedarían enterradas dentro del cuerpo. */
      var largo = Math.hypot(al[0]-de[0], al[1]-de[1], al[2]-de[2]);
      var t0 = (radios[j] + 0.16)/largo;
      var t1 = 1 - (radios[(j+1)%3] + 0.16)/largo;
      for (var q = 0; q <= ESLABON; q++){
        var t = t0 + (t1 - t0)*(q/ESLABON);
        var luce = 0;
        if (vivo){
          var fase = t0 + (t1 - t0)*(((ahora/1500) + j*0.33) % 1);
          luce = Math.max(0, 1 - Math.abs(t - fase)*7);
          luce *= luce;
        }
        poner(de[0]+(al[0]-de[0])*t, de[1]+(al[1]-de[1])*t, de[2]+(al[2]-de[2])*t,
              0.05 + luce*0.05, vivo ? mezclar(GRIS2, AZUL, 0.45) : GRIS, luce);
      }
    }
  }

  function pintar(){
    // de atrás hacia delante: las esferas son opacas y no hay z-buffer
    lista.sort(function(a, b){ return a.z - b.z; });

    var n = Math.min(lista.length, MAX);
    for (var i = 0; i < n; i++){
      var s = lista[i], o = i*8;
      datos[o]   = s.x; datos[o+1] = s.y; datos[o+2] = s.z; datos[o+3] = s.r;
      datos[o+4] = s.c[0]; datos[o+5] = s.c[1]; datos[o+6] = s.c[2];
      datos[o+7] = s.l;
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, datos, 0, n*8);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform3fv(uLuz, [-3.2, 3.6, 4.4]);
    gl.uniform3fv(uHondo, INDIGO);
    gl.uniform3fv(uFondo, PAPEL);
    gl.uniform1f(uDist, DIST);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
  }

  /* ═══════════════ los rótulos, proyectados ═══════════════ */

  var frase = document.getElementById("frase");
  var relojFrase = null;

  function decir(k, deGolpe){
    if (deGolpe){ frase.textContent = FRASES[k]; return; }
    frase.classList.add("cambiando");
    clearTimeout(relojFrase);
    relojFrase = setTimeout(function(){
      frase.textContent = FRASES[k];
      frase.classList.remove("cambiando");
    }, 240);
  }

  var rotulos = document.getElementById("rotulos");
  var chapas = NODOS.map(function(d){
    var el = document.createElement("div");
    el.className = "rotulo-nodo";
    el.innerHTML = '<b>' + d.n + '</b><span>' + d.corto + '</span>';
    rotulos.appendChild(el);
    return el;
  });

  // dónde cae en pantalla un punto de la escena, y cuánto mide allí un cúmulo
  function pantalla(c, escala){
    var z = -c[2];
    if (z < 0.3) return null;
    return {
      x: W/2 + (c[0]*FOCO/(W/H)/z)*(W/2),
      y: H/2 - (c[1]*FOCO/z)*(H/2),
      r: (CUERPO*escala*FOCO/z)*(H/2),
      z: z
    };
  }

  /* ¿Hay un cuerpo delante de este punto de la pantalla? Los rótulos viven en
     HTML, encima del lienzo, así que sin esta prueba el del fondo se leería por
     encima de la esfera que lo está tapando. */
  function tapado(i, px, py){
    for (var j = 0; j < 3; j++){
      if (j === i) continue;
      if (-centros[j][2] >= -centros[i][2]) continue;   // solo lo que está delante
      var q = pantalla(centros[j], escalas[j]);
      if (!q) continue;
      if (Math.hypot(px - q.x, py - q.y) < q.r) return true;
    }
    return false;
  }

  // el rótulo es más ancho que un punto: se prueban tres a lo ancho
  function libre(i, px, py){
    return !tapado(i, px, py) && !tapado(i, px - 42, py) && !tapado(i, px + 42, py);
  }

  var visto = [1, 1, 1];

  function colocarRotulos(){
    for (var i = 0; i < 3; i++){
      var p = pantalla(centros[i], escalas[i]);
      if (!p) continue;

      // el rótulo va siempre debajo de su cuerpo; si ahí lo tapa otro, se apaga
      var abajo = p.y + p.r + 12;
      chapas[i].style.transform =
        "translate(" + p.x.toFixed(1) + "px," + abajo.toFixed(1) + "px) translateX(-50%)";

      // lo que está lejos se lava, igual que las esferas
      var meta = libre(i, p.x, abajo + 8) ? 0.42 + 0.58*Math.min(1, 11/p.z) : 0;
      // en el cierre, debajo de la que manda va su frase, no su rótulo
      if (cierreT > 0.02) meta *= (1 - manda[i]*cierreT);
      visto[i] += (meta - visto[i])*0.18;
      chapas[i].style.opacity = visto[i].toFixed(3);
      chapas[i].classList.toggle("mando", i === elegido);
    }

    if (cierreT > 0.02){
      // el sitio principal no se mueve: basta con proyectarlo una vez por cuadro
      var yc = H/2 - ((ELIPSE_C - ELIPSE_B)*FOCO/DIST)*(H/2);
      var rp = (CUERPO*1.30*FOCO/DIST)*(H/2);
      frase.style.top = (yc + rp + 22).toFixed(0) + "px";
    }
  }

  /* ═══════════════ el bucle ═══════════════ */

  var lento = window.matchMedia &&
              window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function cuadro(ahora){
    if (!ultimo) ultimo = ahora;
    var dt = Math.min(64, ahora - ultimo);
    ultimo = ahora;
    // el anillo gira en el sentido en que los problemas se alimentan
    // la mudanza al cierre y la vuelta atrás, suaves
    cierreT += ((enCierre ? 1 : 0) - cierreT)*0.055;
    if (Math.abs((enCierre ? 1 : 0) - cierreT) < 0.002) cierreT = enCierre ? 1 : 0;

    // el tercio de vuelta que da la elipse en cada paso del cierre
    giroCierre += (metaCierre - giroCierre)*0.075;

    if (enCierre){
      // el anillo se detiene: en el cierre manda la elipse
    } else if (destino !== null){
      // el anillo se vuelve para traer al elegido al frente, siempre hacia
      // adelante: aunque presente a alguien, el ciclo no gira al revés
      giro += (destino - giro)*0.055;
      if (destino - giro < 0.004){ giro = destino; destino = null; }
    } else if (!quieto && !lento){
      giro += (dt/VUELTA)*Math.PI*2;
    }
    armar(ahora);
    pintar();
    colocarRotulos();
    requestAnimationFrame(cuadro);
  }

  /* ═══════════════ elegir ═══════════════ */

  var selector = document.getElementById("selector");
  var tarjeta  = document.getElementById("tarjeta");
  var elCita   = document.getElementById("cita");
  var elPie    = document.getElementById("citaPie");
  var elDet    = document.getElementById("detalle");
  var botones = [], reloj = null, primero = true;

  NODOS.forEach(function(d, i){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = d.corto;
    b.addEventListener("click", function(){ elegir(i); });
    selector.appendChild(b);
    botones.push(b);
  });

  /* Traer al elegido al frente del anillo. El punto más cercano a la cámara
     es el de ángulo pi/2, así que de ahí sale la meta del giro. */
  function presentar(i){
    var meta = Math.PI - i*Math.PI*2/3;
    var vuelta = Math.PI*2;
    var falta = ((meta - giro) % vuelta + vuelta) % vuelta;
    destino = giro + falta;
  }

  function elegir(i){
    if (i === elegido && !primero) return;
    elegido = i;
    presentar(i);
    var d = NODOS[i];
    botones.forEach(function(b, j){ b.setAttribute("aria-pressed", String(j === i)); });

    var pintarFicha = function(){
      elCita.textContent = d.cita;
      elPie.textContent  = d.pie;
      if (d.detalle) {
        elDet.textContent = d.detalle;
        elDet.style.display = "";
      } else {
        elDet.textContent = "";
        elDet.style.display = "none";
      }
      tarjeta.classList.remove("cambiando");
    };
    if (primero){ primero = false; pintarFicha(); return; }
    tarjeta.classList.add("cambiando");
    clearTimeout(reloj);
    reloj = setTimeout(pintarFicha, 200);
  }

  /* ── el recorrido ──────────────────────────────────────
     Uno a uno con las flechas. Pasados los tres, el siguiente abre el cierre;
     y desde el cierre, el siguiente devuelve al índice. */
  function avanzar(){
    if (!enCierre){
      if (elegido < NODOS.length - 1){ elegir(elegido + 1); return; }
      enCierre = true;
      pasoCierre = 0;
      metaCierre = 0;
      raiz.classList.add("cierre");
      decir(0, true);
      return;
    }
    if (pasoCierre < FRASES.length - 1){
      // un tercio de vuelta: la de arriba a la izquierda baja a mandar
      pasoCierre++;
      metaCierre += TERCIO;
      decir(pasoCierre);
      return;
    }
    if (window.Taller && Taller.dentroDelDeck) Taller.ir("indice");
    else location.href = "../slides 2/page3.html";
  }

  function retroceder(){
    if (!enCierre){
      if (elegido > 0) elegir(elegido - 1);
      return;
    }
    if (pasoCierre > 0){
      pasoCierre--;
      metaCierre -= TERCIO;
      decir(pasoCierre);
      return;
    }
    enCierre = false;
    raiz.classList.remove("cierre");
  }

  addEventListener("keydown", function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === "ArrowRight" || k === "ArrowDown" || k === " " || k === "PageDown"){
      avanzar(); e.preventDefault();
    } else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp"){
      retroceder(); e.preventDefault();
    }
  });

  /* Dentro del deck la lámina vive en un iframe: sin foco no le llegan las
     teclas. Se lo pide al llegar y también en cuanto alguien la toca. */
  function tomarFoco(){ try { window.focus(); } catch(err){} }
  window.alLlegarLamina = tomarFoco;
  addEventListener("pointerdown", tomarFoco);
  tomarFoco();

  /* El clic se resuelve por geometría: se proyecta el centro de cada cúmulo y
     gana el más cercano al puntero dentro de su radio. Con tres bolas que se
     tapan entre sí, cualquier caja del DOM mentiría. */
  lienzo.addEventListener("click", function(ev){
    if (enCierre){ avanzar(); return; }
    var caja = lienzo.getBoundingClientRect();
    var x = ev.clientX - caja.left, y = ev.clientY - caja.top;
    var gana = -1, mejor = Infinity;
    for (var i = 0; i < 3; i++){
      var p = pantalla(centros[i], escalas[i]);
      if (!p) continue;
      var d = Math.hypot(x - p.x, y - p.y);
      if (d < p.r && d < mejor){ mejor = d; gana = i; }
    }
    if (gana !== -1) elegir(gana);
  });

  /* Mientras alguien está encima el anillo se para: perseguir una bola que se
     mueve no es una gracia. */
  var grafo = document.getElementById("grafo");
  grafo.addEventListener("pointerenter", function(){ quieto = true; });
  grafo.addEventListener("pointerleave", function(){ quieto = false; });

  addEventListener("resize", medir);
  if (window.ResizeObserver) new ResizeObserver(medir).observe(lienzo);
  medir();
  elegir(0);
  requestAnimationFrame(cuadro);
})();
</script>
</body>
</html>
